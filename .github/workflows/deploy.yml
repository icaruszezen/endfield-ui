name: 构建与部署

# 推送到 main 后：格式检查、代码检查、类型检查、测试、构建组件库与 Storybook，
# 再把 Storybook 发布到 GitHub Pages；同时拿这份 Storybook 去跑浏览器实测。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一次部署；排队中的旧任务会被新的推送顶掉，正在部署的不打断
concurrency:
  group: pages
  cancel-in-progress: false

# 运行环境固定到具体版本，不用 ubuntu-latest：这个标签会跟着 GitHub 换到新系统
# （2026-10-19 起指向 Ubuntu 26），固定之后升级由我们自己决定。
# 要升的时候三个 job 一起改，并确认一次完整的构建与部署。
jobs:
  build:
    name: 检查与构建
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7

      # pnpm 的版本取自根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: 代码检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建组件库
        run: pnpm build

      - name: 构建 Storybook
        run: pnpm build:docs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/storybook-static

      # 给 browser job 用。Pages 的那一份是打过包的，不方便直接拿来起服务
      - uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: apps/docs/storybook-static
          retention-days: 1

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 在真的浏览器里按键、点击、读焦点（apps/docs/browser-checks）。
  # 和 deploy 并行，不挡发布：没过会在提交上标红，在线预览照常更新。
  # 脚本没有依赖，所以这里不装包；浏览器用 runner 自带的 Chrome。
  browser:
    name: 浏览器实测
    needs: build
    runs-on: ubuntu-24.04
    # 正常一两分钟跑完。工作流共用一个并发组，这个 job 要是挂住了，
    # 后面的推送会一直排队等它——所以给它一个硬上限
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: apps/docs/storybook-static

      - name: 键盘、焦点与布局的实测
        working-directory: apps/docs
        # 和 apps/docs/package.json 里的 test:browser 是同一条命令（这里没装 pnpm）
        run: node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit "browser-checks/*.check.ts"
        env:
          BROWSER_FLAGS: --no-sandbox

      - name: 上传没过时的截图
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-check-screenshots
          path: apps/docs/browser-checks/.artifacts
          if-no-files-found: ignore
          include-hidden-files: true
