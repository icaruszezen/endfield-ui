<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">官网桌面端布局线框</title>
  <desc id="d">左侧是窄的图标导航轨，主舞台由整幅主视觉占据，主角偏离中心，标题块在右侧，底部右侧停靠深色下载坞。</desc>
  <rect width="960" height="440" fill="#fafafa"/>

  <!-- 视口 -->
  <rect x="40" y="40" width="640" height="360" fill="#e6e6e6"/>

  <!-- 主视觉占位 -->
  <polygon points="250,400 300,150 350,90 420,150 470,400" fill="#cfcfcf"/>
  <circle cx="352" cy="150" r="46" fill="#bdbdbd"/>
  <path d="M70 300L250 220M470 240L680 160" stroke="#d9d9d9" stroke-width="2"/>
  <rect x="496" y="208" width="160" height="56" fill="#b3b3b3"/>
  <rect x="508" y="222" width="96" height="10" fill="#fafafa"/>
  <rect x="508" y="240" width="136" height="6" fill="#e6e6e6"/>

  <!-- 侧轨 -->
  <rect x="40" y="40" width="30" height="360" fill="#ffffff"/>
  <path d="M70 40v360" stroke="#d9d9d9"/>
  <rect x="45" y="46" width="20" height="20" fill="#191919"/>
  <rect x="40" y="84" width="3" height="18" fill="#191919"/>
  <rect x="49" y="87" width="12" height="12" fill="#191919"/>
  <g fill="#d9d9d9">
    <rect x="49" y="105" width="12" height="12"/>
    <rect x="49" y="123" width="12" height="12"/>
    <rect x="49" y="141" width="12" height="12"/>
    <rect x="49" y="159" width="12" height="12"/>
    <rect x="49" y="177" width="12" height="12"/>
    <rect x="49" y="195" width="12" height="12"/>
  </g>
  <rect x="47" y="258" width="16" height="46" rx="8" fill="#f2f2f2"/>
  <g fill="#8a8a8a"><circle cx="55" cy="268" r="3"/><circle cx="55" cy="281" r="3"/><circle cx="55" cy="294" r="3"/></g>
  <rect x="44" y="318" width="22" height="50" fill="#191919"/>
  <polygon points="50,326 60,326 55,334" fill="#ffffff"/>
  <rect x="53" y="340" width="4" height="22" fill="#ffffff"/>
  <rect x="44" y="374" width="22" height="12" fill="#e6e6e6"/>

  <!-- 下载坞 -->
  <rect x="326" y="334" width="344" height="56" fill="#191919"/>
  <rect x="334" y="341" width="42" height="42" fill="#ffffff"/>
  <g fill="#383838">
    <rect x="384" y="342" width="62" height="18"/><rect x="452" y="342" width="62" height="18"/><rect x="520" y="342" width="62" height="18"/>
    <rect x="384" y="365" width="62" height="18"/><rect x="452" y="365" width="62" height="18"/><rect x="520" y="365" width="62" height="18"/>
    <rect x="596" y="342" width="66" height="18"/><rect x="596" y="365" width="66" height="18"/>
  </g>
  <path d="M589 342v41" stroke="#484848" stroke-width="2"/>

  <!-- 标注点 -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">
    <circle cx="92" cy="56" r="10" fill="#191919"/><text x="92" y="60">1</text>
    <circle cx="92" cy="93" r="10" fill="#191919"/><text x="92" y="97">2</text>
    <circle cx="92" cy="343" r="10" fill="#191919"/><text x="92" y="347">3</text>
    <circle cx="352" cy="232" r="10" fill="#191919"/><text x="352" y="236">4</text>
    <circle cx="576" cy="194" r="10" fill="#191919"/><text x="576" y="198">5</text>
    <circle cx="498" cy="320" r="10" fill="#191919"/><text x="498" y="324">6</text>
  </g>

  <!-- 尺寸 -->
  <path d="M40 412h30M40 408v8M70 408v8" stroke="#191919" stroke-width="1.5" fill="none"/>
  <text x="76" y="416" font-size="11" fill="#191919" font-family="'Space Grotesk',Consolas,monospace">7.5rem = 视口宽的 4.7%</text>

  <!-- 图例 -->
  <g font-size="13" fill="#191919">
    <text x="712" y="64"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">1</tspan>　导航轨</text>
    <text x="712" y="124"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">2</tspan>　当前项</text>
    <text x="712" y="184"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">3</tspan>　主行动块</text>
    <text x="712" y="244"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">4</tspan>　偏心主角</text>
    <text x="712" y="304"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">5</tspan>　标题块</text>
    <text x="712" y="364"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">6</tspan>　停靠坞</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="736" y="84">白底、只放图标，悬停</text>
    <text x="736" y="101">时向右展开文字</text>
    <text x="736" y="144">图标变墨色，左缘</text>
    <text x="736" y="161">出现短竖条</text>
    <text x="736" y="204">黑底白字竖排，悬停</text>
    <text x="736" y="221">整块变信号黄</text>
    <text x="736" y="264">人物或主图偏离</text>
    <text x="736" y="281">画面中心</text>
    <text x="736" y="324">压在主视觉的一侧，</text>
    <text x="736" y="341">不居中</text>
    <text x="736" y="384">次要入口集中在底边，</text>
    <text x="736" y="401">深色、紧凑、靠右</text>
  </g>
</svg>
