<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">云游戏页首页布局线框</title>
  <desc id="d">通宽的黑色细顶栏压在整幅主视觉上：左边标志、竖分隔和两个文字页签，选中项下有一根白线和一个小三角；右边一排图标加竖线加文字的导航项，第一项是带黄色左缘的亮色块。主视觉右侧竖直居中是宣传块和一灰一黄两颗胶囊按钮，顶部居中一条深色的浏览器提示，左下角是适龄角标。</desc>
  <rect width="960" height="440" fill="#fafafa"/>

  <!-- 视口与主视觉 -->
  <rect x="40" y="40" width="640" height="360" fill="#d5dbe1"/>
  <polygon points="150,400 190,170 250,120 300,170 330,400" fill="#bcc5cd"/>
  <circle cx="250" cy="150" r="34" fill="#a9b3bc"/>
  <polygon points="260,400 300,230 345,200 390,240 410,400" fill="#c3cbd2"/>
  <circle cx="345" cy="225" r="26" fill="#b2bbc4"/>
  <path d="M40 330L230 270M410 300L680 220" stroke="#e3e7eb" stroke-width="2"/>

  <!-- 顶栏 -->
  <rect x="40" y="40" width="640" height="30" fill="#191919"/>
  <rect x="49" y="45" width="48" height="20" fill="#eeeeee"/>
  <text x="73" y="59" font-size="9" font-weight="700" fill="#191919" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">LOGO</text>
  <path d="M108 48v15" stroke="#737373" stroke-width="1.5"/>
  <rect x="106.5" y="46" width="3" height="2" fill="#737373"/>
  <rect x="106.5" y="63" width="3" height="2" fill="#737373"/>
  <text x="128" y="58" font-size="9" fill="#eeeeee" text-anchor="middle">首页</text>
  <text x="156" y="58" font-size="9" fill="#737373" text-anchor="middle">更多</text>
  <rect x="120" y="63" width="16" height="1.2" fill="#eeeeee"/>
  <polygon points="126.5,64.2 129.5,64.2 128,66" fill="#eeeeee"/>

  <!-- 导航项 -->
  <rect x="412.5" y="47" width="2" height="16" fill="#fff100"/>
  <rect x="415.5" y="47" width="41" height="16" rx="2" fill="#eeeeee"/>
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="460" y="47" width="47.5" height="16" rx="2"/>
    <rect x="511.5" y="47" width="55.5" height="16" rx="2"/>
    <rect x="570.5" y="47" width="41" height="16" rx="2"/>
    <rect x="615.5" y="47" width="55.5" height="16" rx="2"/>
  </g>
  <g fill="#292929"><rect x="420" y="51" width="8" height="8"/><rect x="431" y="50" width="0.6" height="10" fill-opacity="0.4"/><rect x="434" y="53" width="18" height="4"/></g>
  <g fill="#bfbfbf">
    <rect x="465" y="51" width="8" height="8"/><rect x="476" y="50" width="0.6" height="10" fill-opacity="0.5"/><rect x="479" y="53" width="22" height="4"/>
    <rect x="516.5" y="51" width="8" height="8"/><rect x="527.5" y="50" width="0.6" height="10" fill-opacity="0.5"/><rect x="530.5" y="53" width="30" height="4"/>
    <rect x="575.5" y="51" width="8" height="8"/><rect x="586.5" y="50" width="0.6" height="10" fill-opacity="0.5"/><rect x="589.5" y="53" width="16" height="4"/>
    <rect x="620.5" y="51" width="8" height="8"/><rect x="631.5" y="50" width="0.6" height="10" fill-opacity="0.5"/><rect x="634.5" y="53" width="30" height="4"/>
  </g>
  <rect x="470.5" y="47" width="5" height="5" fill="#ff7500" transform="rotate(45 473 49.5)"/>

  <!-- 浏览器提示 -->
  <rect x="255.5" y="83" width="209" height="31" rx="2" fill="#000000" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.2"/>
  <circle cx="271" cy="98.5" r="8" fill="#737373"/>
  <rect x="284" y="91" width="130" height="4" fill="#bfbfbf"/>
  <rect x="284" y="101" width="150" height="4" fill="#bfbfbf"/>
  <path d="M446 94l8 8M454 94l-8 8" stroke="#737373" stroke-width="1.5"/>

  <!-- 宣传块：标志、括号标题、平台条、标语都在一张图里 -->
  <rect x="459.5" y="129" width="176" height="182" fill="#ffffff" fill-opacity="0.35" stroke="#ffffff" stroke-dasharray="4 3"/>
  <rect x="497.5" y="142" width="100" height="34" fill="#eeeeee"/>
  <text x="547.5" y="163" font-size="10" font-weight="700" fill="#191919" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">LOGO</text>
  <path d="M488 190h-6v34h6M607 190h6v34h-6" stroke="#191919" stroke-width="3" fill="none"/>
  <rect x="495" y="198" width="105" height="18" fill="#2a3a5c"/>
  <rect x="497.5" y="236" width="100" height="13" fill="#ffffff"/>
  <path d="M530 238l-4 9M563 238l-4 9" stroke="#d9d9d9" stroke-width="1.2"/>
  <rect x="510.5" y="262" width="74" height="5" fill="#ffffff"/>
  <rect x="520.5" y="273" width="54" height="2.5" fill="#ffffff" fill-opacity="0.8"/>

  <!-- 胶囊按钮对 -->
  <rect x="460" y="320" width="83.5" height="21" rx="10.5" fill="#eeeeee"/>
  <rect x="551" y="320" width="83.5" height="21" rx="10.5" fill="#f2e200"/>
  <rect x="461" y="321" width="81.5" height="19" rx="9.5" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="0.6"/>
  <rect x="552" y="321" width="81.5" height="19" rx="9.5" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="0.6"/>
  <g fill="#292929">
    <rect x="468" y="330.2" width="14" height="0.6" fill-opacity="0.4"/><rect x="467" y="329.7" width="1.5" height="1.5"/><rect x="481.5" y="329.7" width="1.5" height="1.5"/>
    <rect x="490" y="328.5" width="32" height="4"/><rect x="527" y="326" width="9" height="9"/>
    <rect x="559" y="330.2" width="14" height="0.6" fill-opacity="0.4"/><rect x="558" y="329.7" width="1.5" height="1.5"/><rect x="572.5" y="329.7" width="1.5" height="1.5"/>
    <rect x="581" y="328.5" width="32" height="4"/><circle cx="622.5" cy="330.5" r="4.5"/>
  </g>

  <!-- 适龄角标 -->
  <rect x="49" y="352" width="30" height="39" fill="#ffffff" stroke="#191919"/>
  <rect x="49" y="352" width="30" height="27" fill="#2a84b4"/>

  <!-- 标注点 -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">
    <circle cx="40" cy="55" r="10" fill="#191919" stroke="#fafafa" stroke-width="2"/><text x="40" y="59">1</text>
    <circle cx="142" cy="84" r="10" fill="#191919"/><text x="142" y="88">2</text>
    <circle cx="436" cy="84" r="10" fill="#191919"/><text x="436" y="88">3</text>
    <circle cx="360" cy="128" r="10" fill="#191919"/><text x="360" y="132">4</text>
    <circle cx="459.5" cy="129" r="10" fill="#191919"/><text x="459.5" y="133">5</text>
    <circle cx="547" cy="362" r="10" fill="#191919"/><text x="547" y="366">6</text>
  </g>

  <!-- 尺寸 -->
  <path d="M690 40v30M686 40h8M686 70h8" stroke="#191919" stroke-width="1.5" fill="none"/>
  <text x="40" y="420" font-size="11" fill="#191919" font-family="'Space Grotesk',Consolas,monospace">1440 × 810：顶栏 68px，按钮 188 × 48px，宣传块离右边 100px</text>

  <!-- 图例 -->
  <g font-size="13" fill="#191919">
    <text x="712" y="64"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">1</tspan>　顶栏</text>
    <text x="712" y="124"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">2</tspan>　文字页签</text>
    <text x="712" y="184"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">3</tspan>　导航项</text>
    <text x="712" y="244"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">4</tspan>　浏览器提示</text>
    <text x="712" y="304"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">5</tspan>　宣传块</text>
    <text x="712" y="364"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">6</tspan>　胶囊按钮对</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="736" y="84">黑 80% 加背景模糊，</text>
    <text x="736" y="101">不吸顶</text>
    <text x="736" y="144">选中项下一根白线和</text>
    <text x="736" y="161">一个小三角，切换时平移</text>
    <text x="736" y="204">图标、竖线、文字；"下载"</text>
    <text x="736" y="221">是亮底，左缘一根黄竖条</text>
    <text x="736" y="264">带边框和关闭钮，</text>
    <text x="736" y="281">不自动消失</text>
    <text x="736" y="324">标志、括号标题、平台条、</text>
    <text x="736" y="341">标语都在一张图里</text>
    <text x="736" y="384">一灰一黄，同样大，</text>
    <text x="736" y="401">黄的在右</text>
  </g>
</svg>
