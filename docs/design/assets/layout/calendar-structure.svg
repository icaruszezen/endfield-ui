<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">版本日历的结构</title>
  <desc id="d">顶部是使用版本主题色的刊头；下方是带日期锚点的时间轴；左侧是类目竖轨；右侧是按起始日期错落排列的活动横幅，每条横幅有黑色名称块和类型标签。</desc>
  <rect width="960" height="440" fill="#fafafa"/>

  <rect x="40" y="40" width="600" height="360" fill="#ffffff" stroke="#d9d9d9"/>

  <!-- 刊头 -->
  <rect x="40" y="40" width="600" height="70" fill="#c9d3e6"/>
  <polygon points="40,110 200,40 320,40 160,110" fill="#b3c0da"/>
  <rect x="150" y="62" width="150" height="26" fill="#ffffff"/>
  <rect x="160" y="71" width="90" height="8" fill="#191919"/>
  <rect x="560" y="52" width="64" height="46" fill="#191919"/>

  <!-- 时间轴 -->
  <rect x="96" y="120" width="544" height="14" fill="#e6e6e6"/>
  <g fill="#191919">
    <rect x="96" y="118" width="46" height="18"/><rect x="330" y="118" width="46" height="18"/><rect x="470" y="118" width="46" height="18"/>
  </g>
  <g fill="#f62a2a">
    <polygon points="96,118 104,118 96,126"/><polygon points="330,118 338,118 330,126"/><polygon points="470,118 478,118 470,126"/>
  </g>
  <g font-size="10" font-weight="700" fill="#ffffff" font-family="'Space Grotesk',Consolas,monospace" text-anchor="middle">
    <text x="121" y="131">09.02</text><text x="355" y="131">09.24</text><text x="495" y="131">10.01</text>
  </g>
  <g stroke="#d9d9d9" stroke-dasharray="3 3"><path d="M96 136v264"/><path d="M330 136v264"/><path d="M470 136v264"/></g>

  <!-- 类目竖轨 -->
  <g fill="#7f8fb0">
    <rect x="48" y="146" width="40" height="84"/><rect x="48" y="238" width="40" height="72"/><rect x="48" y="318" width="40" height="72"/>
  </g>
  <g fill="#ffffff"><rect x="60" y="158" width="16" height="16"/><rect x="60" y="250" width="16" height="16"/><rect x="60" y="330" width="16" height="16"/></g>

  <!-- 横幅 -->
  <rect x="96" y="146" width="310" height="38" fill="#d9c7ea"/>
  <rect x="330" y="192" width="300" height="38" fill="#f3c2cf"/>
  <rect x="96" y="238" width="250" height="32" fill="#cdd3dd"/>
  <rect x="330" y="278" width="220" height="32" fill="#f1cfd2"/>
  <rect x="96" y="318" width="390" height="32" fill="#383838"/>
  <rect x="96" y="358" width="534" height="32" fill="#383838"/>
  <!-- 名称块 + 类型 chip -->
  <g fill="#191919">
    <rect x="104" y="154" width="70" height="22"/><rect x="338" y="200" width="70" height="22"/>
    <rect x="104" y="244" width="60" height="20"/><rect x="338" y="284" width="60" height="20"/>
  </g>
  <g fill="#ffffff" stroke="#b3b3b3">
    <rect x="352" y="150" width="46" height="12"/><rect x="576" y="196" width="46" height="12"/>
    <rect x="292" y="242" width="46" height="12"/><rect x="496" y="282" width="46" height="12"/>
  </g>
  <!-- 黄色侧签行 -->
  <g fill="#fffa00"><rect x="96" y="318" width="6" height="32"/><rect x="96" y="358" width="6" height="32"/></g>
  <g stroke="#fffa00" stroke-dasharray="4 4"><path d="M190 334h286"/><path d="M190 374h430"/></g>
  <g fill="#fafafa"><rect x="112" y="329" width="64" height="9"/><rect x="112" y="369" width="64" height="9"/></g>

  <!-- 标注点 -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">
    <circle cx="460" cy="74" r="10" fill="#191919"/><text x="460" y="78">1</text>
    <circle cx="420" cy="127" r="10" fill="#191919"/><text x="420" y="131">2</text>
    <circle cx="68" cy="204" r="10" fill="#191919"/><text x="68" y="208">3</text>
    <circle cx="250" cy="165" r="10" fill="#191919"/><text x="250" y="169">4</text>
    <circle cx="530" cy="334" r="10" fill="#191919"/><text x="530" y="338">5</text>
  </g>

  <!-- 图例 -->
  <g font-size="13" fill="#191919">
    <text x="672" y="62"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">1</tspan>　刊头</text>
    <text x="672" y="134"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">2</tspan>　时间轴与日期锚</text>
    <text x="672" y="206"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">3</tspan>　类目竖轨</text>
    <text x="672" y="278"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">4</tspan>　活动横幅</text>
    <text x="672" y="350"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">5</tspan>　系统类条目</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="696" y="82">版本主题色与纹样接管；标题压在</text>
    <text x="696" y="99">白色块上；右侧是标志位</text>
    <text x="696" y="154">浅色轴条；日期是黑块白字，</text>
    <text x="696" y="171">左上带一个小红角</text>
    <text x="696" y="226">每个类目一段色块 + 图标，</text>
    <text x="696" y="243">颜色跟随版本主题</text>
    <text x="696" y="298">从起始日的位置开始，长度即持续</text>
    <text x="696" y="315">时间；黑色名称块 + 白底类型标签</text>
    <text x="696" y="370">炭灰底、黄色侧签、黄色虚线，</text>
    <text x="696" y="387">不带主题图</text>
  </g>
  <text x="40" y="424" font-size="11" fill="#8a8a8a">结构是稳定的，颜色随版本主题变化。图中的蓝灰色只是"某个版本主题色"的占位。</text>
</svg>
