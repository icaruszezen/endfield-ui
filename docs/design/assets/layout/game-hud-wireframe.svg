<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">游戏运行界面的分区示意</title>
  <desc id="d">画面中心留空给场景，信息分成四组停靠在四角：左上是地图与任务，右上是资源与菜单，左下是队伍与生命，右下是技能与行动。底部中央是交互提示。</desc>
  <rect width="960" height="440" fill="#fafafa"/>

  <!-- 场景 -->
  <rect x="40" y="40" width="640" height="360" fill="#282828"/>
  <path d="M40 300L200 250 330 280 470 230 680 270V400H40z" fill="#383838"/>
  <path d="M40 340L240 310 420 330 680 300V400H40z" fill="#484848"/>

  <!-- 中心留空 -->
  <rect x="230" y="110" width="260" height="190" fill="none" stroke="#8a8a8a" stroke-dasharray="6 6"/>
  <text x="360" y="200" font-size="13" fill="#b3b3b3" text-anchor="middle">中心留给场景</text>
  <text x="360" y="220" font-size="11" fill="#8a8a8a" text-anchor="middle">不放常驻控件</text>

  <!-- 左上：地图 + 任务 -->
  <circle cx="92" cy="92" r="36" fill="#141414" stroke="#8a8a8a"/>
  <path d="M70 100q14-22 26-8t20-12" fill="none" stroke="#626262"/>
  <polygon points="92,84 97,96 92,93 87,96" fill="#fffa00"/>
  <rect x="140" y="62" width="4" height="30" fill="#fffa00"/>
  <rect x="150" y="64" width="96" height="8" fill="#fafafa"/>
  <rect x="150" y="80" width="70" height="6" fill="#8a8a8a"/>

  <!-- 右上：资源胶囊 + 菜单 -->
  <rect x="470" y="56" width="84" height="22" rx="11" fill="#141414"/>
  <circle cx="482" cy="67" r="6" fill="#fcba00"/>
  <rect x="494" y="64" width="44" height="6" fill="#fafafa"/>
  <rect x="562" y="56" width="70" height="22" rx="11" fill="#141414"/>
  <circle cx="574" cy="67" r="6" fill="#24bafc"/>
  <rect x="586" y="64" width="34" height="6" fill="#fafafa"/>
  <rect x="642" y="56" width="22" height="22" fill="#fafafa"/>
  <polygon points="664,44 664,56 652,56" fill="#fc6c00" transform="rotate(0)"/>

  <!-- 左下：队伍 + 生命 -->
  <g>
    <circle cx="76" cy="358" r="20" fill="#626262" stroke="#fffa00" stroke-width="3"/>
    <circle cx="124" cy="362" r="16" fill="#626262"/>
    <circle cx="162" cy="362" r="16" fill="#626262"/>
    <circle cx="200" cy="362" r="16" fill="#626262"/>
  </g>
  <rect x="56" y="318" width="150" height="6" fill="#141414"/>
  <rect x="56" y="318" width="108" height="6" fill="#06a2a2"/>

  <!-- 右下：技能环 + 行动 -->
  <circle cx="632" cy="346" r="28" fill="#141414" stroke="#fafafa" stroke-width="2"/>
  <circle cx="570" cy="366" r="20" fill="#141414" stroke="#8a8a8a" stroke-width="2"/>
  <path d="M570 346A20 20 0 0 1 590 366" fill="none" stroke="#fffa00" stroke-width="3"/>
  <circle cx="596" cy="310" r="20" fill="#141414" stroke="#8a8a8a" stroke-width="2"/>
  <circle cx="650" cy="290" r="16" fill="#141414" stroke="#8a8a8a" stroke-width="2"/>
  <g fill="#fafafa" font-size="9" font-family="'Space Grotesk',Consolas,monospace" text-anchor="middle">
    <rect x="577" y="386" width="14" height="12"/><rect x="603" y="330" width="14" height="12"/><rect x="655" y="306" width="14" height="12"/>
  </g>
  <g fill="#191919" font-size="9" font-weight="700" font-family="'Space Grotesk',Consolas,monospace" text-anchor="middle">
    <text x="584" y="395">E</text><text x="610" y="339">Q</text><text x="662" y="315">R</text>
  </g>

  <!-- 底部中央：交互提示 -->
  <rect x="322" y="330" width="16" height="16" fill="#fafafa"/>
  <text x="330" y="342" font-size="10" font-weight="700" fill="#191919" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">F</text>
  <rect x="344" y="335" width="60" height="6" fill="#fafafa"/>

  <!-- 标注点 -->
  <g font-size="12" font-weight="700" fill="#191919" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">
    <circle cx="92" cy="146" r="10" fill="#fffa00"/><text x="92" y="150">1</text>
    <circle cx="566" cy="96" r="10" fill="#fffa00"/><text x="566" y="100">2</text>
    <circle cx="232" cy="358" r="10" fill="#fffa00"/><text x="232" y="362">3</text>
    <circle cx="530" cy="340" r="10" fill="#fffa00"/><text x="530" y="344">4</text>
    <circle cx="430" cy="338" r="10" fill="#fffa00"/><text x="430" y="342">5</text>
  </g>

  <!-- 图例 -->
  <g font-size="13" fill="#191919">
    <text x="712" y="64"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">1</tspan>　方位与目标</text>
    <text x="712" y="136"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">2</tspan>　资源与入口</text>
    <text x="712" y="208"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">3</tspan>　队伍与生命</text>
    <text x="712" y="280"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">4</tspan>　技能与行动</text>
    <text x="712" y="352"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">5</tspan>　交互提示</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="736" y="84">圆形小地图；任务标题左侧</text>
    <text x="736" y="101">一条黄色短竖条</text>
    <text x="736" y="156">胶囊承载货币；通知用</text>
    <text x="736" y="173">橙色角标</text>
    <text x="736" y="228">圆形头像，当前角色带黄环；</text>
    <text x="736" y="245">生命条为青色</text>
    <text x="736" y="300">圆形技能钮，冷却用弧线；</text>
    <text x="736" y="317">键位提示是白色小方块</text>
    <text x="736" y="372">键帽 + 文字，靠近画面下方</text>
    <text x="736" y="389">中央，按需出现</text>
  </g>
  <text x="40" y="424" font-size="11" fill="#8a8a8a">依据社区项目对实机画面的文字描述绘制，只表达分区关系，不是界面复刻。</text>
</svg>
