<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">分节标签组的构成</title>
  <desc id="d">一组小型装饰元素：微文字行、带斜箭头的灰色滑块与英文标题、中文标题、加号框、两行说明微文字、点阵和三色注册条。</desc>
  <rect width="960" height="400" fill="#fafafa"/>

  <rect x="40" y="40" width="470" height="320" fill="#ffffff" stroke="#d9d9d9"/>

  <!-- 1 微文字行 -->
  <polygon points="76,74 86,74 81,82" fill="#8a8a8a"/>
  <text x="92" y="82" font-size="10" fill="#8a8a8a" letter-spacing="0.6" font-family="'Space Grotesk',Consolas,monospace">// ENDFIELD-UI · DESIGN REFERENCE</text>

  <!-- 2 滑块 + 英文 -->
  <rect x="76" y="94" width="104" height="34" fill="#d9d9d9"/>
  <path d="M152 102l16 16M168 104v14h-14" fill="none" stroke="#191919" stroke-width="3"/>
  <text x="190" y="122" font-size="32" font-weight="500" fill="#191919" font-family="'Outfit','Century Gothic','Segoe UI',sans-serif">ELEMENTS</text>

  <!-- 3 中文标题 -->
  <text x="76" y="176" font-size="42" font-weight="700" fill="#191919">母题图解</text>

  <!-- 4 加号框 -->
  <rect x="76" y="212" width="18" height="18" fill="none" stroke="#8a8a8a" stroke-width="1.5"/>
  <path d="M80 221h10M85 216v10" stroke="#8a8a8a" stroke-width="1.5"/>

  <!-- 5 说明微文字 -->
  <g font-size="10" fill="#8a8a8a" letter-spacing="0.5" font-family="'Space Grotesk',Consolas,monospace">
    <text x="76" y="252">**SECTION 03 OF 05.</text>
    <text x="76" y="266">ORIGINAL DIAGRAMS ONLY.</text>
  </g>

  <!-- 6 点阵 -->
  <g fill="#8a8a8a">
    <rect x="76" y="280" width="6" height="6"/><rect x="86" y="280" width="6" height="6"/><rect x="96" y="280" width="6" height="6"/>
    <rect x="106" y="280" width="6" height="6"/><rect x="116" y="280" width="6" height="6"/><rect x="126" y="280" width="6" height="6"/>
    <rect x="76" y="290" width="6" height="6"/><rect x="86" y="290" width="6" height="6"/><rect x="96" y="290" width="6" height="6"/>
    <rect x="106" y="290" width="6" height="6"/><rect x="116" y="290" width="6" height="6"/><rect x="126" y="290" width="6" height="6"/>
  </g>

  <!-- 7 注册条 -->
  <rect x="76" y="306" width="6" height="14" fill="#ec008c"/>
  <rect x="76" y="320" width="6" height="14" fill="#00aeef"/>
  <rect x="76" y="334" width="6" height="14" fill="#fff200"/>
  <rect x="84" y="306" width="6" height="26" fill="#d9d9d9"/>

  <!-- 标注点 -->
  <g font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">
    <circle cx="56" cy="78" r="10" fill="#191919"/><text x="56" y="82">1</text>
    <circle cx="56" cy="111" r="10" fill="#191919"/><text x="56" y="115">2</text>
    <circle cx="56" cy="161" r="10" fill="#191919"/><text x="56" y="165">3</text>
    <circle cx="56" cy="221" r="10" fill="#191919"/><text x="56" y="225">4</text>
    <circle cx="56" cy="255" r="10" fill="#191919"/><text x="56" y="259">5</text>
    <circle cx="56" cy="288" r="10" fill="#191919"/><text x="56" y="292">6</text>
    <circle cx="56" cy="327" r="10" fill="#191919"/><text x="56" y="331">7</text>
  </g>

  <!-- 图例 -->
  <g font-size="13" fill="#191919">
    <text x="548" y="62"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">1</tspan>　微文字行</text>
    <text x="548" y="110"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">2</tspan>　滑块 + 英文标题</text>
    <text x="548" y="158"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">3</tspan>　中文标题</text>
    <text x="548" y="206"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">4</tspan>　加号框</text>
    <text x="548" y="254"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">5</tspan>　说明微文字</text>
    <text x="548" y="302"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">6</tspan>　点阵</text>
    <text x="548" y="350"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">7</tspan>　注册条</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="572" y="80">text-micro，三级文字色；写真实的站名或栏目名</text>
    <text x="572" y="128">灰块宽约为高的 3 倍，斜箭头靠右；英文 Medium</text>
    <text x="572" y="176">Bold，比英文大约三分之一</text>
    <text x="572" y="224">定位点；与正文左缘对齐</text>
    <text x="572" y="272">最多两行，全大写，写与本节相关的真实内容</text>
    <text x="572" y="320">2 行 × 6 个小方点，纯装饰</text>
    <text x="572" y="368">品红、青、黄三段竖条，旁边配一条灰条</text>
  </g>
  <text x="40" y="384" font-size="11" fill="#8a8a8a">只在版块的开头出现一次。1 – 3 是标题本体，4 – 7 是可删减的伴饰；窄屏保留 1 – 3。</text>
</svg>
