<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">云游戏页的几样母题</title>
  <desc id="d">六个小样：品红、薄荷绿、黄三段的竖条，CSS 画的一版比例是七比八比十九，图片里的一版三段等长、黄段往下渐隐；每五根一根深色长刻度的刻度尺，一直向左走；主图两个对角各一个黑边黄芯的方块；标题压在黄横条上，上方一个黄描边的倒三角，左上和右下一对 L 形角括号；公告列表里大号的日、小号的月和一根斜线组成的日期块；胶囊按钮的剖面，内缩一圈细线，文字前一根两端带小方块的细线，最右一个图标。</desc>
  <defs>
    <linearGradient id="y-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffa00"/>
      <stop offset="0.38" stop-color="#fffa00"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="470" fill="#fafafa"/>

  <!-- 1 三色竖条 -->
  <text x="40" y="34" font-size="13" font-weight="700" fill="#191919">三色竖条</text>
  <rect x="40" y="52" width="250" height="150" fill="#ffffff" stroke="#e6e6e6"/>
  <rect x="60" y="72" width="8" height="24.5" fill="#fe1aab"/>
  <rect x="60" y="96.5" width="8" height="28" fill="#3bffb7"/>
  <rect x="60" y="124.5" width="8" height="66.5" fill="#fefb3c"/>
  <text x="78" y="86" font-size="12" fill="#191919">CSS 画的</text>
  <text x="78" y="103" font-size="11" fill="#626262" font-family="'Space Grotesk',Consolas,monospace">7 : 8 : 19</text>
  <text x="78" y="120" font-size="11" fill="#626262">硬分段</text>
  <text x="78" y="137" font-size="11" fill="#626262">分享浮层</text>
  <rect x="172" y="72" width="8" height="20" fill="#ff1aac"/>
  <rect x="172" y="92" width="8" height="20" fill="#00ffa2"/>
  <rect x="172" y="112" width="8" height="60" fill="url(#y-fade)"/>
  <text x="190" y="86" font-size="12" fill="#191919">图里的</text>
  <text x="190" y="103" font-size="11" fill="#626262" font-family="'Space Grotesk',Consolas,monospace">1 : 1 : 1</text>
  <text x="190" y="120" font-size="11" fill="#626262">黄段渐隐</text>
  <text x="190" y="137" font-size="11" fill="#626262">下载卡片</text>

  <!-- 2 刻度尺 -->
  <text x="340" y="34" font-size="13" font-weight="700" fill="#191919">刻度尺</text>
  <rect x="340" y="52" width="280" height="150" fill="#ffffff" stroke="#e6e6e6"/>
  <g stroke="#cfcfcf" stroke-width="3">
    <path d="M360 100v20M374 100v20M388 100v20M402 100v20M430 100v20M444 100v20M458 100v20M472 100v20M500 100v20M514 100v20M528 100v20M542 100v20M570 100v20M584 100v20M598 100v20"/>
  </g>
  <g stroke="#999999" stroke-width="4.5">
    <path d="M416 96v28M486 96v28M556 96v28"/>
  </g>
  <rect x="540" y="94" width="72" height="32" fill="#ffffff" fill-opacity="0.6"/>
  <path d="M470 150h-90M380 150l8-5M380 150l8 5" stroke="#191919" stroke-width="1.5" fill="none"/>
  <text x="480" y="154" font-size="11" fill="#626262">两份首尾相接，40s 一圈</text>
  <text x="360" y="182" font-size="11" fill="#626262">每五根一根深灰长刻度；右端渐隐</text>

  <!-- 3 角块 -->
  <text x="640" y="34" font-size="13" font-weight="700" fill="#191919">角块</text>
  <rect x="640" y="52" width="280" height="150" fill="#ffffff" stroke="#e6e6e6"/>
  <rect x="680" y="76" width="200" height="104" fill="#d9d9d9"/>
  <rect x="871" y="67" width="18" height="18" fill="#000000"/>
  <rect x="873.5" y="69.5" width="13" height="13" fill="#fdfd1f"/>
  <rect x="671" y="171" width="18" height="18" fill="#000000"/>
  <rect x="673.5" y="173.5" width="13" height="13" fill="#fdfd1f"/>
  <text x="696" y="124" font-size="11" fill="#626262">方块的中心落在主图的角上</text>
  <text x="696" y="141" font-size="11" fill="#626262">桌面：右上、左下</text>
  <text x="696" y="158" font-size="11" fill="#626262">窄屏：左上、右下</text>

  <!-- 4 标题横条 -->
  <text x="40" y="244" font-size="13" font-weight="700" fill="#191919">标题横条</text>
  <rect x="40" y="262" width="250" height="168" fill="#f3f3f3" stroke="#e6e6e6"/>
  <rect x="56" y="330" width="226" height="22" fill="#fdfd1f"/>
  <rect x="56" y="330" width="9" height="22" fill="#cccccc"/>
  <polygon points="80,290 140,290 110,346" fill="#ffffff" stroke="#fdfd1f" stroke-width="7" stroke-linejoin="miter"/>
  <text x="168" y="337" font-size="22" font-weight="900" fill="#000000" text-anchor="middle">卖点标题</text>
  <path d="M112 322v-14h14" stroke="#1a1a1a" stroke-width="5" fill="none"/>
  <path d="M226 334v14h-14" stroke="#1a1a1a" stroke-width="5" fill="none"/>
  <text x="168" y="380" font-size="14" fill="#000000" text-anchor="middle">一行标语</text>
  <text x="56" y="414" font-size="11" fill="#626262">除两行字外都是图片</text>

  <!-- 5 斜线日期 -->
  <text x="340" y="244" font-size="13" font-weight="700" fill="#191919">斜线日期</text>
  <rect x="340" y="262" width="280" height="168" fill="#ffffff" stroke="#e6e6e6"/>
  <rect x="364" y="306" width="232" height="64" rx="7" fill="#2c2c2d" stroke="#898989"/>
  <text x="402" y="332" font-size="24" fill="#989898" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">15</text>
  <path d="M398 360L432 326" stroke="#989898" stroke-width="1.5"/>
  <text x="440" y="362" font-size="13" fill="#989898" text-anchor="end">10月</text>
  <rect x="454" y="322" width="2" height="31" fill="#989898"/>
  <rect x="470" y="329" width="110" height="7" fill="#ffffff"/>
  <rect x="470" y="342" width="80" height="7" fill="#ffffff"/>
  <text x="364" y="404" font-size="11" fill="#626262">大号的日、小号的月，中间一根转 −45° 的细线</text>

  <!-- 6 胶囊按钮剖面 -->
  <text x="640" y="244" font-size="13" font-weight="700" fill="#191919">胶囊按钮</text>
  <rect x="640" y="262" width="280" height="168" fill="#ffffff" stroke="#e6e6e6"/>
  <rect x="664" y="300" width="232" height="56" rx="28" fill="#f2e200"/>
  <rect x="667" y="303" width="226" height="50" rx="25" fill="none" stroke="#000000" stroke-opacity="0.2" stroke-width="1.2"/>
  <rect x="692" y="327.4" width="40" height="1.2" fill="#292929" fill-opacity="0.4"/>
  <rect x="688.5" y="326.2" width="3.5" height="3.5" fill="#292929" fill-opacity="0.4"/>
  <rect x="732" y="326.2" width="3.5" height="3.5" fill="#292929" fill-opacity="0.4"/>
  <rect x="752" y="320" width="72" height="16" fill="#292929"/>
  <circle cx="862" cy="328" r="11" fill="#292929"/>
  <text x="664" y="384" font-size="11" fill="#626262">60px 圆角，里面内缩 2px 一圈 1px 的线；</text>
  <text x="664" y="401" font-size="11" fill="#626262">文字前一根两端带 3px 方块的细线，</text>
  <text x="664" y="418" font-size="11" fill="#626262">最右一个 24px 图标</text>
</svg>
