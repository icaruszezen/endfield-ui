<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">测绘与仪表叠层</title>
  <desc id="d">深色画面上的五种叠层元素：带缺口和刻度的圆环、取景角与准星、坐标读数、滚动提示、录制指示。</desc>
  <rect width="960" height="420" fill="#fafafa"/>

  <rect x="40" y="40" width="560" height="320" fill="#141414"/>

  <!-- 1 刻度圆环 -->
  <g fill="none">
    <circle cx="250" cy="200" r="96" stroke="#fafafa" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M250 80A120 120 0 0 1 354 140" stroke="#fafafa" stroke-opacity="0.55" stroke-width="6"/>
    <path d="M146 260A120 120 0 0 1 132 180" stroke="#fafafa" stroke-opacity="0.55" stroke-width="6"/>
    <circle cx="250" cy="200" r="120" stroke="#fafafa" stroke-opacity="0.5" stroke-width="10" pathLength="400" stroke-dasharray="1.5 8.5"/>
  </g>
  <!-- 主体占位：点云示意 -->
  <g fill="#fafafa" fill-opacity="0.7">
    <circle cx="214" cy="214" r="1.5"/><circle cx="226" cy="204" r="1.5"/><circle cx="238" cy="198" r="1.5"/><circle cx="250" cy="190" r="1.5"/>
    <circle cx="262" cy="186" r="1.5"/><circle cx="274" cy="182" r="1.5"/><circle cx="286" cy="186" r="1.5"/><circle cx="232" cy="212" r="1.5"/>
    <circle cx="244" cy="206" r="1.5"/><circle cx="256" cy="200" r="1.5"/><circle cx="268" cy="196" r="1.5"/><circle cx="280" cy="196" r="1.5"/>
    <circle cx="222" cy="222" r="1.5"/><circle cx="238" cy="220" r="1.5"/><circle cx="254" cy="214" r="1.5"/><circle cx="270" cy="208" r="1.5"/>
    <circle cx="206" cy="226" r="1.5"/><circle cx="292" cy="198" r="1.5"/><circle cx="246" cy="226" r="1.5"/><circle cx="262" cy="222" r="1.5"/>
  </g>

  <!-- 2 取景角 + 准星 -->
  <g fill="none" stroke="#fafafa" stroke-width="1.5">
    <path d="M56 72v-16h16"/><path d="M568 56h16v16"/><path d="M584 328v16h-16"/><path d="M72 344h-16v-16"/>
  </g>
  <path d="M244 200h12M250 194v12" stroke="#fffa00" stroke-width="1.5"/>

  <!-- 3 坐标读数 -->
  <g font-size="10" fill="#b3b3b3" letter-spacing="0.6" font-family="'Space Grotesk',Consolas,monospace">
    <text x="80" y="326">X 0128.40</text>
    <text x="80" y="340">Y 0064.75</text>
    <text x="164" y="326">SCALE 1:200</text>
    <text x="164" y="340">REV 2026.10</text>
  </g>

  <!-- 4 滚动提示 -->
  <path d="M440 300v36" stroke="#fafafa" stroke-opacity="0.4" stroke-width="1"/>
  <circle cx="440" cy="318" r="3" fill="#fafafa"/>
  <text x="440" y="292" font-size="9" fill="#b3b3b3" text-anchor="middle" letter-spacing="1" font-family="'Space Grotesk',Consolas,monospace">SCROLL</text>

  <!-- 5 录制指示 -->
  <text x="520" y="82" font-size="11" fill="#fafafa" font-family="'Space Grotesk',Consolas,monospace">[ REC ]</text>
  <circle cx="508" cy="78" r="3.5" fill="#f62a2a"/>

  <!-- 标注点 -->
  <g font-size="12" font-weight="700" fill="#191919" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">
    <circle cx="372" cy="132" r="10" fill="#fffa00"/><text x="372" y="136">1</text>
    <circle cx="96" cy="72" r="10" fill="#fffa00"/><text x="96" y="76">2</text>
    <circle cx="276" cy="330" r="10" fill="#fffa00"/><text x="276" y="334">3</text>
    <circle cx="464" cy="318" r="10" fill="#fffa00"/><text x="464" y="322">4</text>
    <circle cx="482" cy="78" r="10" fill="#fffa00"/><text x="482" y="82">5</text>
  </g>

  <!-- 图例 -->
  <g font-size="13" fill="#191919">
    <text x="632" y="62"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">1</tspan>　刻度圆环</text>
    <text x="632" y="130"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">2</tspan>　取景角与准星</text>
    <text x="632" y="198"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">3</tspan>　坐标读数</text>
    <text x="632" y="266"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">4</tspan>　滚动提示</text>
    <text x="632" y="334"><tspan font-weight="700" font-family="'Space Grotesk',Consolas,monospace">5</tspan>　录制指示</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="656" y="82">细实线内环 + 外圈短刻度 + 两段不对称的</text>
    <text x="656" y="99">粗弧；围住三维主体，可缓慢旋转</text>
    <text x="656" y="150">四角 L 形线标出画面范围；准星标出焦点，</text>
    <text x="656" y="167">焦点处可用信号黄</text>
    <text x="656" y="218">text-micro、等宽数字、低对比；必须是</text>
    <text x="656" y="235">真实数据，否则不要放</text>
    <text x="656" y="286">细线 + 下坠的光点；内容可滚动时才出现</text>
    <text x="656" y="354">红点硬切明灭；只在确有"进行中"语义时用</text>
  </g>
  <text x="40" y="388" font-size="11" fill="#8a8a8a">刻度圆环与滚动提示见于官网（观察 / 实测）；取景角、坐标读数、录制指示出自社区项目的归纳。</text>
  <text x="40" y="406" font-size="11" fill="#8a8a8a">这类叠层只出现在展示性的深色画面上，不进入表单、列表等日常操作界面。</text>
</svg>
