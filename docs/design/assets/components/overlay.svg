<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">浮层类组件</title>
  <desc id="d">弹窗的结构：深色斜纹标题栏、居中标题、关闭图标、点阵内容区和底部按钮。以及下拉菜单、文字提示和抽屉。</desc>
  <defs>
    <pattern id="oh" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M-1 1L1 -1M0 6L6 0M5 7L7 5" stroke="#000000" stroke-width="1.9"/>
    </pattern>
    <pattern id="od" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1.1" fill="#191919"/>
    </pattern>
  </defs>
  <rect width="960" height="470" fill="#fafafa"/>

  <!-- 弹窗 -->
  <text x="40" y="34" font-size="13" font-weight="700" fill="#191919">弹窗</text>
  <rect x="40" y="52" width="520" height="330" fill="#000000" fill-opacity=".5"/>
  <rect x="80" y="84" width="440" height="268" fill="#fafafa"/>
  <rect x="80" y="84" width="440" height="268" fill="url(#od)" opacity=".08"/>
  <!-- 标题栏 -->
  <rect x="80" y="84" width="440" height="60" fill="#1f1f1f"/>
  <rect x="80" y="84" width="440" height="60" fill="url(#oh)" opacity=".5"/>
  <text x="300" y="121" font-size="22" fill="#ffffff" text-anchor="middle">弹窗标题</text>
  <g fill="#ffffff" fill-opacity=".5"><rect x="282" y="132" width="4" height="4"/><rect x="290" y="132" width="4" height="4"/><rect x="298" y="132" width="4" height="4"/><rect x="306" y="132" width="4" height="4"/><rect x="314" y="132" width="4" height="4"/></g>
  <path d="M484 104l20 20M504 104l-20 20" stroke="#ffffff" stroke-width="2.5"/>
  <!-- 内容 -->
  <rect x="104" y="166" width="392" height="110" fill="#fafafa"/>
  <g fill="#191919"><rect x="116" y="180" width="120" height="9"/></g>
  <g fill="#b3b3b3"><rect x="116" y="200" width="360" height="5"/><rect x="116" y="212" width="330" height="5"/><rect x="116" y="224" width="348" height="5"/><rect x="116" y="236" width="220" height="5"/></g>
  <!-- 底部按钮 -->
  <rect x="270" y="296" width="110" height="38" fill="#ffffff" stroke="#d9d9d9"/>
  <rect x="280" y="306" width="3" height="18" fill="#8a8a8a"/>
  <text x="330" y="320" font-size="14" font-weight="500" fill="#191919" text-anchor="middle">取消</text>
  <rect x="390" y="296" width="110" height="38" fill="#383838"/>
  <rect x="400" y="306" width="3" height="18" fill="#fffa00"/>
  <text x="450" y="320" font-size="14" font-weight="500" fill="#eeeeee" text-anchor="middle">确认</text>
  <!-- 左下装饰 -->
  <path d="M92 340h30M92 340v-16" stroke="#b3b3b3" stroke-width="1.5" fill="none"/>

  <!-- 标注 -->
  <g font-size="12" font-weight="700" fill="#191919" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">
    <circle cx="96" cy="114" r="10" fill="#fffa00"/><text x="96" y="118">1</text>
    <circle cx="460" cy="114" r="10" fill="#fffa00"/><text x="460" y="118">2</text>
    <circle cx="510" cy="220" r="10" fill="#fffa00"/><text x="510" y="224">3</text>
    <circle cx="250" cy="315" r="10" fill="#fffa00"/><text x="250" y="319">4</text>
  </g>
  <g font-size="12" fill="#191919">
    <text x="40" y="406"><tspan font-weight="700">1</tspan>　标题栏：深灰叠斜纹，标题居中、常规字重、白色；下方一排小点</text>
    <text x="40" y="426"><tspan font-weight="700">2</tspan>　关闭：白色叉，悬停旋转 90°</text>
    <text x="40" y="446"><tspan font-weight="700">3</tspan>　内容区：近白底叠 8% 点阵；正文垫实色　<tspan font-weight="700">4</tspan>　行动靠右，主行动在最右</text>
  </g>

  <!-- 下拉菜单 -->
  <text x="610" y="34" font-size="13" font-weight="700" fill="#191919">下拉菜单</text>
  <rect x="610" y="52" width="150" height="112" fill="#191919"/>
  <rect x="610" y="52" width="75" height="4" fill="#fffa00"/>
  <rect x="610" y="56" width="150" height="36" fill="#fffa00"/>
  <text x="626" y="79" font-size="13" font-weight="700" fill="#191919">当前项</text>
  <text x="626" y="115" font-size="13" fill="#ffffff">选项二</text>
  <text x="626" y="151" font-size="13" fill="#ffffff">选项三</text>
  <g font-size="12" fill="#626262">
    <text x="780" y="76">深色面板，顶部一条</text>
    <text x="780" y="94">半宽强调条；当前项</text>
    <text x="780" y="112">整行强调色、墨字；</text>
    <text x="780" y="130">无圆角、无分隔线</text>
  </g>

  <!-- 文字提示 -->
  <text x="610" y="204" font-size="13" font-weight="700" fill="#191919">文字提示</text>
  <rect x="610" y="222" width="126" height="30" fill="#191919"/>
  <polygon points="630,252 642,252 636,260" fill="#191919"/>
  <text x="673" y="242" font-size="12" fill="#ffffff" text-anchor="middle">简短的说明文字</text>
  <rect x="620" y="264" width="32" height="32" fill="#f2f2f2"/>
  <path d="M630 274l12 12M642 274l-12 12" stroke="#626262" stroke-width="2"/>
  <g font-size="12" fill="#626262">
    <text x="780" y="238">墨底白字、直角、小三角</text>
    <text x="780" y="256">指向触发元素；只放一句话</text>
  </g>

  <!-- 抽屉 -->
  <text x="610" y="336" font-size="13" font-weight="700" fill="#191919">抽屉</text>
  <rect x="610" y="354" width="170" height="96" fill="#e6e6e6"/>
  <rect x="610" y="354" width="170" height="96" fill="#000000" fill-opacity=".5"/>
  <rect x="700" y="354" width="80" height="96" fill="#fafafa"/>
  <rect x="700" y="354" width="80" height="20" fill="#1f1f1f"/>
  <rect x="700" y="354" width="3" height="96" fill="#fffa00"/>
  <g fill="#b3b3b3"><rect x="712" y="386" width="56" height="4"/><rect x="712" y="396" width="48" height="4"/><rect x="712" y="406" width="52" height="4"/></g>
  <g font-size="12" fill="#626262">
    <text x="800" y="374">从一侧滑入，贴边通高；</text>
    <text x="800" y="392">靠内容一侧可加一条</text>
    <text x="800" y="410">强调竖条；窄屏上替代</text>
    <text x="800" y="428">侧栏与详情栏</text>
  </g>
</svg>
