<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">表单控件</title>
  <desc id="d">输入框的默认、聚焦、错误、禁用四种状态；下拉触发器；复选框、单选框的方形方案与菱形方案；开关；步进器。</desc>
  <rect width="960" height="470" fill="#fafafa"/>

  <!-- 输入框 -->
  <text x="40" y="34" font-size="13" font-weight="700" fill="#191919">输入框</text>

  <text x="40" y="66" font-size="12" font-weight="500" fill="#191919">标签</text>
  <rect x="40" y="74" width="200" height="40" fill="#f2f2f2"/>
  <path d="M40 114h200" stroke="#b3b3b3" stroke-width="2"/>
  <text x="52" y="99" font-size="14" fill="#8a8a8a">占位文字</text>

  <text x="264" y="66" font-size="12" font-weight="500" fill="#191919">标签</text>
  <rect x="264" y="74" width="200" height="40" fill="#f2f2f2"/>
  <path d="M264 114h200" stroke="#191919" stroke-width="2"/>
  <text x="276" y="99" font-size="14" fill="#191919">已输入内容</text>
  <path d="M352 86v18" stroke="#191919" stroke-width="1.5"/>
  <rect x="260" y="70" width="208" height="48" fill="none" stroke="#191919" stroke-width="2"/>

  <text x="488" y="66" font-size="12" font-weight="500" fill="#191919">标签</text>
  <rect x="488" y="74" width="200" height="40" fill="#f2f2f2"/>
  <path d="M488 114h200" stroke="#de0909" stroke-width="2"/>
  <text x="500" y="99" font-size="14" fill="#191919">错误的内容</text>
  <polygon points="672,86 680,94 672,102 664,94" fill="#de0909"/>
  <text x="488" y="132" font-size="12" fill="#de0909">◆ 说明哪里不对、怎么改</text>

  <text x="712" y="66" font-size="12" font-weight="500" fill="#b3b3b3">标签</text>
  <rect x="712" y="74" width="200" height="40" fill="#f2f2f2"/>
  <path d="M712 114h200" stroke="#d9d9d9" stroke-width="2"/>
  <text x="724" y="99" font-size="14" fill="#b3b3b3">不可编辑</text>

  <g font-size="12" fill="#626262">
    <text x="40" y="132">默认：凹陷底 + 底边线</text>
    <text x="264" y="140">聚焦：底边变墨色 + 焦点环</text>
    <text x="712" y="132">禁用</text>
  </g>

  <path d="M40 164h880" stroke="#d9d9d9"/>

  <!-- 选择类 -->
  <text x="40" y="194" font-size="13" font-weight="700" fill="#191919">选择</text>

  <!-- 下拉 -->
  <rect x="40" y="212" width="200" height="40" fill="#f2f2f2"/>
  <path d="M40 252h200" stroke="#b3b3b3" stroke-width="2"/>
  <text x="52" y="237" font-size="14" fill="#191919">选项一</text>
  <polygon points="214,228 228,228 221,238" fill="#191919"/>
  <rect x="40" y="258" width="200" height="94" fill="#fafafa" stroke="#d9d9d9"/>
  <rect x="40" y="258" width="100" height="3" fill="#fffa00"/>
  <rect x="40" y="261" width="200" height="30" fill="#e6e6e6"/>
  <rect x="40" y="261" width="4" height="30" fill="#191919"/>
  <text x="56" y="281" font-size="13" font-weight="700" fill="#191919">选项一</text>
  <text x="56" y="311" font-size="13" fill="#191919">选项二</text>
  <text x="56" y="341" font-size="13" fill="#191919">选项三</text>
  <text x="40" y="372" font-size="12" fill="#626262">下拉面板顶部一条半宽的强调条</text>

  <!-- 复选 / 单选：方案 A -->
  <text x="300" y="222" font-size="12" font-weight="700" fill="#191919">方案 A · 方形（默认）</text>
  <rect x="300" y="238" width="20" height="20" fill="#f2f2f2" stroke="#b3b3b3" stroke-width="2"/>
  <text x="330" y="253" font-size="14" fill="#191919">未选</text>
  <rect x="390" y="238" width="20" height="20" fill="#191919"/>
  <path d="M395 248l4 4 7-8" fill="none" stroke="#fffa00" stroke-width="2.5"/>
  <text x="420" y="253" font-size="14" fill="#191919">已选</text>
  <rect x="480" y="238" width="20" height="20" fill="#191919"/>
  <path d="M485 248h10" stroke="#fffa00" stroke-width="2.5"/>
  <text x="510" y="253" font-size="14" fill="#191919">半选</text>

  <circle cx="310" cy="288" r="10" fill="#f2f2f2" stroke="#b3b3b3" stroke-width="2"/>
  <text x="330" y="293" font-size="14" fill="#191919">未选</text>
  <circle cx="400" cy="288" r="10" fill="#191919"/>
  <circle cx="400" cy="288" r="4" fill="#fffa00"/>
  <text x="420" y="293" font-size="14" fill="#191919">已选</text>

  <!-- 方案 B -->
  <text x="300" y="332" font-size="12" font-weight="700" fill="#191919">方案 B · 菱形（社区）</text>
  <polygon points="310,346 322,358 310,370 298,358" fill="none" stroke="#8a8a8a" stroke-width="2"/>
  <text x="330" y="363" font-size="14" fill="#191919">未选 ◇</text>
  <polygon points="410,346 422,358 410,370 398,358" fill="#191919"/>
  <text x="430" y="363" font-size="14" fill="#191919">已选 ◆</text>
  <text x="300" y="392" font-size="12" fill="#626262">单选与复选都用菱形，实心 = 已选</text>

  <!-- 开关 -->
  <text x="600" y="222" font-size="12" font-weight="700" fill="#191919">开关</text>
  <rect x="600" y="238" width="52" height="28" rx="14" fill="#b3b3b3"/>
  <circle cx="614" cy="252" r="10" fill="#fafafa"/>
  <text x="662" y="257" font-size="14" fill="#191919">关</text>
  <rect x="704" y="238" width="52" height="28" rx="14" fill="#191919"/>
  <circle cx="742" cy="252" r="10" fill="#fffa00"/>
  <text x="766" y="257" font-size="14" fill="#191919">开</text>
  <!-- 双标签开关 -->
  <rect x="600" y="284" width="84" height="32" rx="16" fill="#383838"/>
  <circle cx="620" cy="300" r="13" fill="#e6e6e6"/>
  <text x="620" y="304" font-size="10" font-weight="700" fill="#191919" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">2D</text>
  <text x="660" y="304" font-size="10" fill="#b3b3b3" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">3D</text>
  <text x="700" y="304" font-size="12" fill="#626262">双标签：旋钮上写当前值</text>

  <!-- 步进器 -->
  <text x="600" y="346" font-size="12" font-weight="700" fill="#191919">步进器</text>
  <rect x="600" y="360" width="36" height="36" fill="#383838"/>
  <path d="M610 378h16" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="636" y="360" width="64" height="36" fill="#f2f2f2"/>
  <text x="668" y="384" font-size="15" font-weight="700" fill="#191919" text-anchor="middle" font-family="'Space Grotesk',Consolas,monospace">12</text>
  <rect x="700" y="360" width="36" height="36" fill="#383838"/>
  <path d="M710 378h16M718 370v16" stroke="#ffffff" stroke-width="2.5"/>

  <text x="40" y="430" font-size="11" fill="#8a8a8a">官网几乎没有表单，这一页大部分是按整体语言推导出来的建议。双标签开关按官网的 2D / 3D 切换器绘制；</text>
  <text x="40" y="448" font-size="11" fill="#8a8a8a">下拉面板的顶部强调条按官网语言下拉菜单绘制；菱形方案出自 ReEnd 组件库。</text>
</svg>
