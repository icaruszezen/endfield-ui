<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d" font-family="'HarmonyOS Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">
  <title id="t">按钮的变体、状态与尺寸</title>
  <desc id="d">五种按钮变体：行动、中性、浅色、返回、文字。中性按钮的五种状态：默认、悬停、按下、禁用、聚焦。三档尺寸以及圆形和方形的图标按钮。</desc>
  <defs>
    <pattern id="bh" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M-1 1L1 -1M0 6L6 0M5 7L7 5" stroke="#424242" stroke-width="1.5"/>
    </pattern>
    <filter id="amb" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/></filter>
  </defs>
  <rect width="960" height="520" fill="#fafafa"/>

  <!-- 变体 -->
  <text x="40" y="34" font-size="13" font-weight="700" fill="#191919">变体</text>

  <rect x="40" y="52" width="160" height="48" fill="#fffa00" filter="url(#amb)"/>
  <path d="M180 60v32" stroke="#e6de01" stroke-width="3"/>
  <text x="110" y="82" font-size="16" font-weight="500" fill="#191919" text-anchor="middle">前往游戏</text>

  <rect x="220" y="52" width="160" height="48" fill="#383838" filter="url(#amb)"/>
  <rect x="234" y="65" width="3" height="22" fill="#fffa00"/>
  <text x="304" y="82" font-size="16" font-weight="500" fill="#eeeeee" text-anchor="middle">更多情报</text>

  <rect x="400" y="52" width="160" height="48" fill="#ffffff" filter="url(#amb)"/>
  <rect x="414" y="65" width="3" height="22" fill="#8a8a8a"/>
  <text x="484" y="82" font-size="16" font-weight="500" fill="#191919" text-anchor="middle">取消</text>

  <rect x="580" y="52" width="160" height="48" fill="#383838"/>
  <rect x="580" y="52" width="160" height="48" fill="url(#bh)"/>
  <path d="M604 68l-8 8 8 8" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <text x="668" y="82" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">返回</text>

  <text x="768" y="82" font-size="16" font-weight="500" fill="#191919">查看全部</text>
  <path d="M842 70l10 10M852 72v8h-8" fill="none" stroke="#191919" stroke-width="2"/>
  <path d="M768 90h88" stroke="#191919" stroke-width="1.5"/>

  <g font-size="13" font-weight="700" fill="#191919">
    <text x="40" y="124">action 行动</text>
    <text x="220" y="124">control 中性</text>
    <text x="400" y="124">light 浅色</text>
    <text x="580" y="124">back 返回</text>
    <text x="768" y="124">text 文字</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="40" y="142">每屏唯一的主要行动</text>
    <text x="220" y="142">默认按钮</text>
    <text x="400" y="142">深色底上，或次要选项</text>
    <text x="580" y="142">层级后退，带斜纹</text>
    <text x="768" y="142">行内的低强调行动</text>
  </g>

  <path d="M40 166h880" stroke="#d9d9d9"/>

  <!-- 状态 -->
  <text x="40" y="196" font-size="13" font-weight="700" fill="#191919">状态</text>
  <text x="76" y="196" font-size="12" fill="#626262">以中性按钮为例</text>

  <rect x="40" y="214" width="150" height="46" fill="#383838"/>
  <rect x="54" y="226" width="3" height="22" fill="#fffa00"/>
  <text x="120" y="243" font-size="15" font-weight="500" fill="#eeeeee" text-anchor="middle">默认</text>

  <rect x="210" y="214" width="150" height="46" fill="#484848"/>
  <polygon points="232,228 242,237 232,246" fill="#fffa00"/>
  <text x="290" y="243" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">悬停</text>

  <rect x="380" y="214" width="150" height="46" fill="#282828"/>
  <polygon points="402,228 412,237 402,246" fill="#fffa00"/>
  <text x="460" y="243" font-size="15" font-weight="500" fill="#ffffff" text-anchor="middle">按下</text>

  <rect x="550" y="214" width="150" height="46" fill="#888888"/>
  <rect x="564" y="226" width="3" height="22" fill="#666666"/>
  <text x="630" y="243" font-size="15" font-weight="500" fill="#666666" text-anchor="middle">禁用</text>

  <rect x="720" y="210" width="158" height="54" fill="none" stroke="#191919" stroke-width="2"/>
  <rect x="724" y="214" width="150" height="46" fill="#383838"/>
  <rect x="738" y="226" width="3" height="22" fill="#fffa00"/>
  <text x="804" y="243" font-size="15" font-weight="500" fill="#eeeeee" text-anchor="middle">聚焦</text>

  <g font-size="11" fill="#626262" font-family="'Space Grotesk',Consolas,monospace">
    <text x="40" y="280">control #383838</text>
    <text x="210" y="280">control-hover #484848</text>
    <text x="380" y="280">control-pressed #282828</text>
    <text x="550" y="280">#888888 / #666666</text>
    <text x="720" y="284">2px focus + 2px 间距</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="40" y="298">竖条 3px</text>
    <text x="210" y="298">竖条变箭头并右移</text>
    <text x="380" y="298">只换色，不缩小</text>
    <text x="550" y="298">不响应悬停</text>
    <text x="720" y="302">仅键盘聚焦时出现</text>
  </g>

  <path d="M40 326h880" stroke="#d9d9d9"/>

  <!-- 尺寸 -->
  <text x="40" y="356" font-size="13" font-weight="700" fill="#191919">尺寸</text>
  <rect x="40" y="394" width="96" height="32" fill="#383838"/>
  <rect x="50" y="402" width="2" height="16" fill="#fffa00"/>
  <text x="92" y="415" font-size="13" font-weight="500" fill="#eeeeee" text-anchor="middle">小</text>
  <rect x="156" y="386" width="124" height="40" fill="#383838"/>
  <rect x="168" y="396" width="3" height="20" fill="#fffa00"/>
  <text x="222" y="412" font-size="15" font-weight="500" fill="#eeeeee" text-anchor="middle">中</text>
  <rect x="300" y="370" width="170" height="56" fill="#fffa00"/>
  <path d="M446 380v36" stroke="#e6de01" stroke-width="3"/>
  <text x="372" y="405" font-size="20" font-weight="500" fill="#191919" text-anchor="middle">大</text>
  <g font-size="11" fill="#626262" font-family="'Space Grotesk',Consolas,monospace">
    <text x="40" y="446">sm 32px · text-sm</text>
    <text x="156" y="446">md 40px · text-base</text>
    <text x="300" y="446">lg 56px · text-lg</text>
  </g>
  <g font-size="12" fill="#626262">
    <text x="40" y="464">工具栏、表格内</text>
    <text x="156" y="464">默认</text>
    <text x="300" y="464">首屏的主要行动</text>
  </g>

  <!-- 图标钮 -->
  <text x="540" y="356" font-size="13" font-weight="700" fill="#191919">图标按钮</text>
  <circle cx="570" cy="400" r="26" fill="#fafafa" filter="url(#amb)"/>
  <path d="M575 390l-10 10 10 10" fill="none" stroke="#383838" stroke-width="2.5"/>
  <circle cx="636" cy="400" r="26" fill="#fafafa" filter="url(#amb)"/>
  <path d="M631 390l10 10-10 10" fill="none" stroke="#383838" stroke-width="2.5"/>
  <rect x="690" y="380" width="40" height="40" fill="#f2f2f2"/>
  <path d="M702 392l16 16M718 392l-16 16" stroke="#626262" stroke-width="2.5"/>
  <rect x="746" y="380" width="40" height="40" fill="#fffa00"/>
  <path d="M758 392l16 16M774 392l-16 16" stroke="#191919" stroke-width="2.5"/>
  <g font-size="12" fill="#626262">
    <text x="540" y="446">圆形：翻页、媒体控制；</text>
    <text x="540" y="464">白底 + 环境阴影</text>
    <text x="690" y="446">方形：工具；浅灰底，</text>
    <text x="690" y="464">悬停或激活变黄</text>
  </g>
  <text x="40" y="500" font-size="11" fill="#8a8a8a">颜色与状态变化取自官网实测；三档高度是把官网尺寸换算到 16px 基准后的建议值。</text>
</svg>
